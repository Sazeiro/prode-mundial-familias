<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial Familias MZM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --bg2:#0E1626;
    --surface:#131C2E;
    --surface2:#182338;
    --border:#243149;
    --border2:#2F4063;
    --txt:#EAF0F8;
    --txt2:#8A99B0;
    --txt3:#5F6E86;
    --amber:#F5A623;
    --amber-dim:#3a2e15;
    --green:#00C46A;
    --green-dim:#0e3a27;
    --red:#FF5C5C;
    --red-dim:#3a1c1f;
    --blue:#3D7BFF;
    --radius:14px;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 500px at 50% -10%, #16233c 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 100px}

  /* ---------- HEADER ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(11,18,32,.96), rgba(11,18,32,.78) 70%, transparent);
    backdrop-filter:blur(8px);
    padding:16px 14px 10px;
    max-width:560px;margin:0 auto;
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .ball{font-size:22px;line-height:1;transform:translateY(2px)}
  .brand h1{
    font-family:'Bebas Neue',sans-serif;font-weight:400;
    font-size:25px;letter-spacing:.5px;margin:0;line-height:.92;
  }
  .brand h1 .yr{color:var(--amber)}
  .whoami{
    font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);
    padding:6px 10px;border-radius:999px;white-space:nowrap;cursor:pointer;
  }
  .whoami b{color:var(--txt)}
  .tagline{font-size:12px;color:var(--txt3);margin:3px 0 0;letter-spacing:.3px}

  /* ---------- TABS ---------- */
  nav.tabs{
    display:flex;gap:4px;margin-top:12px;
    background:var(--surface);border:1px solid var(--border);
    padding:4px;border-radius:12px;
  }
  nav.tabs button{
    flex:1;border:0;background:transparent;color:var(--txt2);
    font-family:'Inter';font-weight:700;font-size:11.5px;letter-spacing:0;
    padding:9px 2px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  nav.tabs button.active{background:var(--amber);color:#1a1305;box-shadow:0 3px 12px rgba(245,166,35,.28)}

  /* ---------- ONBOARDING ---------- */
  .onb{
    margin-top:18vh;text-align:center;animation:fade .4s ease;
  }
  .onb .ball-big{font-size:54px}
  .onb h2{font-family:'Bebas Neue';font-weight:400;font-size:40px;letter-spacing:.5px;margin:8px 0 2px}
  .onb h2 .yr{color:var(--amber)}
  .onb p{color:var(--txt2);font-size:14px;margin:0 0 22px}
  .onb .field{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
  input[type=text]{
    width:100%;background:var(--surface);border:1px solid var(--border2);
    color:var(--txt);font-family:'Inter';font-size:16px;font-weight:600;
    padding:14px 16px;border-radius:12px;outline:none;text-align:center;
  }
  input[type=text]:focus{border-color:var(--amber)}
  .btn{
    width:100%;border:0;cursor:pointer;font-family:'Inter';font-weight:800;
    font-size:15px;padding:14px;border-radius:12px;transition:.15s;
  }
  .btn-amber{background:var(--amber);color:#1a1305}
  .btn-amber:active{transform:scale(.98)}
  .btn-ghost{background:var(--surface);color:var(--txt);border:1px solid var(--border2)}

  /* ---------- SECTION META ---------- */
  .daygroup{margin-top:22px}
  .dayhead{
    display:flex;align-items:center;gap:10px;margin:0 2px 10px;
    color:var(--txt2);
  }
  .dayhead .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .dayhead .lbl{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;color:var(--txt)}
  .dayhead .line{flex:1;height:1px;background:var(--border)}

  /* ---------- MATCH CARD ---------- */
  .match{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:11px 12px;margin-bottom:9px;
    transition:border-color .15s;
  }
  .match.live{border-color:var(--border2)}
  .match .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .gtag{
    font-family:'Bebas Neue';font-size:12px;letter-spacing:1px;color:var(--txt3);
    border:1px solid var(--border);border-radius:6px;padding:1px 6px;
  }
  .ktime{font-size:11px;color:var(--txt3);font-weight:600}
  .ktime.locked{color:var(--red)}
  .ktime.done{color:var(--green)}

  .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;align-items:center;gap:7px;min-width:0}
  .team.away{justify-content:flex-end}
  .team .fl{font-size:21px;line-height:1}
  .team .ab{font-family:'Bebas Neue';font-size:19px;letter-spacing:.5px}
  .team .nm{font-size:10px;color:var(--txt3);display:block;line-height:1;margin-top:1px}
  .team.home .meta{order:2}.team.home .fl{order:1}
  .team.away .meta{order:1;text-align:right}.team.away .fl{order:2}

  .picks{display:flex;gap:5px}
  .pick{
    width:38px;height:42px;border-radius:9px;border:1.5px solid var(--border2);
    background:var(--bg2);color:var(--txt2);
    font-family:'Bebas Neue';font-size:21px;letter-spacing:.5px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .1s, background .12s, color .12s, border-color .12s;
    user-select:none;
  }
  .pick:active{transform:scale(.93)}
  .pick.sel{
    background:var(--amber);color:#1a1305;border-color:var(--amber);
    box-shadow:0 4px 14px rgba(245,166,35,.3);transform:translateY(-1px);
  }
  .pick.disabled{cursor:default;opacity:.55}
  .pick.disabled:active{transform:none}
  .pick.res-correct{background:var(--green);color:#04150d;border-color:var(--green);box-shadow:0 4px 14px rgba(0,196,106,.3)}
  .pick.res-wrong{background:var(--red-dim);color:var(--red);border-color:var(--red)}
  .pick.actual{outline:2px solid var(--green);outline-offset:1px}

  .mfoot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .status{font-size:11px;font-weight:600;color:var(--txt2)}
  .seebtn{
    font-size:11px;font-weight:700;color:var(--amber);background:transparent;
    border:0;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:4px;
  }

  .others{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;display:none}
  .others.show{display:block}
  .orow{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12.5px}
  .orow .onm{color:var(--txt2)}
  .obadge{
    font-family:'Bebas Neue';font-size:14px;width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--txt)
  }
  .obadge.ok{background:var(--green-dim);color:var(--green)}
  .obadge.no{background:var(--red-dim);color:var(--red)}

  /* ---------- PROGRESS ---------- */
  .progress{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-top:4px;display:flex;align-items:center;gap:12px;
  }
  .progress .num{font-family:'Bebas Neue';font-size:30px;color:var(--amber);line-height:1}
  .progress .meta{flex:1}
  .progress .meta .t{font-size:13px;font-weight:700}
  .progress .meta .s{font-size:11px;color:var(--txt2)}
  .bar{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd07a);border-radius:99px;transition:width .4s}

  /* ---------- FIXTURE ---------- */
  .group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .grouphd{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
  .grouphd .g{font-family:'Bebas Neue';font-size:20px;letter-spacing:1px;color:var(--amber)}
  .grouphd .teams{font-size:11px;color:var(--txt2);flex:1;text-align:right}
  .fx{padding:6px 12px}
  .fxrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--border)}
  .fxrow:last-child{border-bottom:0}
  .fxteam{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .fxteam.away{justify-content:flex-end}
  .fxteam .fl{font-size:17px}
  .fxscore{
    font-family:'Bebas Neue';font-size:15px;min-width:54px;text-align:center;
    color:var(--txt2);background:var(--bg2);border-radius:7px;padding:3px 0;letter-spacing:.5px;
  }
  .fxscore.played{color:var(--txt)}
  .fxdate{font-size:9px;color:var(--txt3);text-align:center;margin-top:2px}

  /* ---------- KNOCKOUT ---------- */
  .ko{
    background:linear-gradient(180deg,var(--surface),var(--bg2));
    border:1px dashed var(--border2);border-radius:var(--radius);
    padding:22px 16px;text-align:center;margin-top:6px;
  }
  .ko .ico{font-size:30px}
  .ko h3{font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;margin:8px 0 4px}
  .ko p{font-size:12.5px;color:var(--txt2);margin:0 auto;max-width:330px;line-height:1.5}
  .kostages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  .kostage{font-size:10.5px;font-weight:700;color:var(--txt3);background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:5px 10px}

  /* ---------- STANDINGS ---------- */
  .lead{margin-top:6px}
  .lrow{
    display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:11px 13px;margin-bottom:7px;
  }
  .lrow.me{border-color:var(--amber);background:linear-gradient(90deg,rgba(245,166,35,.08),var(--surface) 40%)}
  .lrow.top1{border-color:var(--border2)}
  .pos{font-family:'Bebas Neue';font-size:22px;color:var(--txt2);text-align:center}
  .lrow.top1 .pos{color:#FFD24A}
  .lrow.top2 .pos{color:#CBD5E1}
  .lrow.top3 .pos{color:#E0A66B}
  .lname{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lname .tagme{font-size:9px;color:var(--amber);font-weight:800;margin-left:5px;letter-spacing:.5px}
  .lac{font-size:11px;color:var(--txt2);text-align:right;line-height:1.2}
  .lac b{color:var(--txt);font-size:12px}
  .lpts{font-family:'Bebas Neue';font-size:26px;color:var(--amber);min-width:42px;text-align:right;line-height:1}
  .lpts small{font-size:10px;color:var(--txt3);font-family:'Inter';display:block;margin-top:-2px;letter-spacing:.5px}

  .empty{text-align:center;color:var(--txt2);font-size:13px;padding:30px 10px;line-height:1.6}
  .empty .e{font-size:34px;display:block;margin-bottom:8px}

  /* ---------- ADMIN ---------- */
  .adminbar{
    display:flex;align-items:center;gap:8px;background:var(--surface2);
    border:1px solid var(--border2);border-radius:11px;padding:10px 12px;margin-bottom:12px;
  }
  .adminbar .ic{font-size:18px}
  .adminbar .tx{flex:1;font-size:12px;color:var(--txt2)}
  .adminbar .tx b{color:var(--txt);display:block;font-size:13px}
  .pinpad{max-width:300px;margin:14vh auto 0;text-align:center}
  .pinpad .ico{font-size:36px}
  .pinpad h3{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;margin:6px 0 14px}
  .ares{display:flex;gap:5px}
  .ares .ap{
    flex:1;height:38px;border-radius:8px;border:1.5px solid var(--border2);background:var(--bg2);
    color:var(--txt2);font-family:'Bebas Neue';font-size:18px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:.12s
  }
  .ares .ap.sel{background:var(--green);color:#04150d;border-color:var(--green)}
  .ares .ap.clear{font-size:13px;font-family:'Inter';font-weight:700}
  .ares .ap.clear.sel{background:var(--surface2);color:var(--txt);border-color:var(--border2)}

  /* ---------- KO BANNER ---------- */
  .koBanner{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(120deg,#163322,var(--surface) 70%);
    border:1px solid var(--green-dim);border-left:4px solid var(--green);
    border-radius:14px;padding:14px 16px;margin-top:4px;margin-bottom:4px;
    animation:fade .4s ease;
  }
  .koBanner-ico{font-size:30px;flex-shrink:0;animation:wob 2.2s ease-in-out infinite}
  .koBanner-t{font-family:'Bebas Neue';font-size:18px;letter-spacing:.5px;color:var(--green);line-height:1.1}
  .koBanner-s{font-size:11.5px;color:var(--txt2);margin-top:2px}

  /* ---------- PLAYER SELECT ---------- */
  .playerlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:300px;overflow-y:auto}
  .playeropt{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;cursor:pointer;transition:.15s;text-align:left;width:100%;
  }
  .playeropt:active{transform:scale(.98)}
  .playeropt:hover{border-color:var(--border2);background:var(--surface2)}
  .playeropt .av{
    width:38px;height:38px;border-radius:50%;background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:18px;color:#1a1305;flex-shrink:0;
  }
  .playeropt .info{flex:1;min-width:0}
  .playeropt .pname{font-size:15px;font-weight:700;color:var(--txt)}
  .playeropt .ppicks{font-size:11px;color:var(--txt2);margin-top:1px}
  .playeropt .arr{color:var(--txt3);font-size:18px}
  .divider{display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--txt3);font-size:12px;font-weight:700}
  .divider span{flex:1;height:1px;background:var(--border)}
  .newplayer{margin-top:2px;display:flex;flex-direction:column;gap:10px}
  .onb .loading-players{color:var(--txt2);font-size:13px;padding:20px 0;text-align:center}

  /* ---------- PREMIOS ---------- */
  .prizehero{
    position:relative;overflow:hidden;text-align:center;
    background:radial-gradient(120% 120% at 50% 0%, #1c2c1e 0%, var(--surface) 58%);
    border:1px solid var(--border2);border-radius:18px;
    padding:26px 16px 24px;margin-top:6px;min-height:300px;
  }
  .moneyrain{position:absolute;inset:0;pointer-events:none;z-index:0}
  .bill{position:absolute;top:-40px;animation-name:fall;animation-iteration-count:infinite;animation-timing-function:linear}
  @keyframes fall{
    0%{transform:translateY(-40px) rotate(0deg);opacity:0}
    12%{opacity:.95}
    88%{opacity:.95}
    100%{transform:translateY(370px) rotate(340deg);opacity:0}
  }
  .trophy{position:relative;z-index:1;font-size:60px;animation:trophy 2.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(245,166,35,.55))}
  @keyframes trophy{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-9px) rotate(5deg)}}
  .prizetitle{
    position:relative;z-index:1;font-family:'Bebas Neue';font-size:56px;letter-spacing:3px;margin:2px 0 14px;
    background:linear-gradient(90deg,#F5A623,#FFE066,#00C46A,#FFE066,#F5A623);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  .sponsorcard{
    position:relative;z-index:1;background:rgba(11,18,32,.72);border:1px solid var(--border2);
    border-radius:14px;padding:14px 16px;margin:0 auto 14px;max-width:360px;
  }
  .sponsorcard .spon-emoji{font-size:26px;margin-bottom:4px;animation:wob 2.5s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  .sponsorcard p{font-size:14px;color:var(--txt);line-height:1.5;margin:0}
  .gracias{font-family:'Bebas Neue';font-size:25px;letter-spacing:1px;color:var(--amber);display:inline-block;margin-top:5px}
  .prizebox{position:relative;z-index:1;margin:0 auto 16px;max-width:360px}
  .prizelabel{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:2px}
  .prizeamount{font-family:'Bebas Neue';font-size:31px;letter-spacing:.5px;color:var(--green);margin-top:3px;text-shadow:0 0 20px rgba(0,196,106,.45)}
  .prizemoney{font-size:36px;margin-top:4px;animation:pop 1.4s ease-in-out infinite}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  .votenudge{
    position:relative;z-index:1;display:inline-block;background:var(--amber);color:#1a1305;
    font-weight:800;font-size:14px;padding:11px 20px;border-radius:99px;
    box-shadow:0 6px 22px rgba(245,166,35,.45);animation:nudge 1.6s ease-in-out infinite;
  }
  @keyframes nudge{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.07) rotate(1.5deg)}}

  .thanksbox{margin-top:18px}
  .thankstitle{font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;text-align:center;margin:0 0 12px;color:var(--txt)}
  .thanksinput{display:flex;gap:8px;margin-bottom:14px}
  .thanksinput input{flex:1;text-align:left}
  .thanksbtn{width:auto;padding:0 18px;border-radius:12px;white-space:nowrap;font-size:14px}
  .thankslist{display:flex;flex-direction:column;gap:8px}
  .thankmsg{
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);
    border-radius:10px;padding:10px 12px;animation:fade .3s ease;
  }
  .thankmsg .tn{display:block;font-size:11px;font-weight:800;color:var(--amber);margin-bottom:2px}
  .thankmsg .tm{font-size:13.5px;color:var(--txt);line-height:1.4;word-break:break-word}
  .thanksempty{text-align:center;color:var(--txt3);font-size:13px;padding:18px}

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--surface2);border:1px solid var(--border2);color:var(--txt);
    padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .floatbtn{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;gap:8px;z-index:30;
  }
  .floatbtn button{
    background:var(--surface2);border:1px solid var(--border2);color:var(--txt2);
    font-size:12px;font-weight:700;padding:9px 14px;border-radius:99px;cursor:pointer;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;
  }
  .spin{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .loadwrap{text-align:center;padding:40px;color:var(--txt2)}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <div class="loadwrap"><span class="spin">⚽</span><p>Cargando el prode…</p></div>
</div>
<div id="toast"></div>

/* ============================================================
   SUPABASE API CALLS
   ============================================================ */
async function supabaseCall(method, table, query='', data=null, extraHeaders=null) {
  try {
    let url = `${SUPABASE_URL}/rest/v1/${table}`;
    if(query) url += query;
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY
      }
    };
    if(data) opts.body = JSON.stringify(data);
    if(method === 'POST' && data) opts.headers['Prefer'] = 'return=representation';
    if(extraHeaders) Object.assign(opts.headers, extraHeaders);
    const res = await fetch(url, opts);
    if(!res.ok) { console.error(`Supabase ${method} ${table}:`, res.status, await res.text()); return null; }
    if(res.status === 204) return true;
    const text = await res.text();
    return text ? JSON.parse(text) : true;
  } catch(e) { console.error('Supabase call error:', e); return null; }
}

async function loadShared() {
  users = await supabaseCall('GET', 'players', '?select=id,name') || [];
  const picks = await supabaseCall('GET', 'picks', '?select=*') || [];
  allPicks = {};
  for(const p of picks) {
    if(!allPicks[p.player_id]) allPicks[p.player_id] = {};
    allPicks[p.player_id][p.match_id] = p.pick;
  }
  const res = await supabaseCall('GET', 'results', '?select=match_id,result') || [];
  results = {};
  for(const r of res) results[r.match_id] = r.result;
  thanks = await supabaseCall('GET', 'thanks', '?select=*&order=created_at.desc') || [];
}

/* ============================================================
   TIME / FORMAT
   ============================================================ */
const DOW=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function parts(iso){ return {y:+iso.slice(0,4),mo:+iso.slice(5,7),d:+iso.slice(8,10),h:+iso.slice(11,13),mi:+iso.slice(14,16)}; }
function dayKey(iso){ return iso.slice(0,10); }
function dayLabel(iso){ const p=parts(iso); const wd=DOW[new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay()]; return `${wd} ${p.d} ${MON[p.mo-1]}`; }
function timeLabel(iso){ const p=parts(iso); return `${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`; }
function started(iso){ return Date.now() >= new Date(iso).getTime(); }

function matchState(m){
  if(results[m.id]) return "done";
  if(ALWAYS_OPEN.includes(m.id)) return "open";
  if(started(m.ko)) return "locked";
  return "open";
}

/* ============================================================
   STANDINGS
   ============================================================ */
// Formato de pick en partidos de eliminación cuando hay empate: "X:1" o "X:2" (X = empate, 1/2 = quién pasa por penales).
// En partidos de grupos el pick es simplemente "1" | "X" | "2".
function pickBase(pick){ return pick ? pick.split(':')[0] : null; }       // "1" | "X" | "2"
function pickPen(pick){ const parts=(pick||'').split(':'); return parts[1]||null; } // "1" | "2" | null

// Calcula los puntos de un pronóstico individual contra el resultado real de ese partido.
function calcPoints(pick, result, knockout){
  if(!pick || !result) return 0;
  const pb = pickBase(pick), rb = pickBase(result);
  if(!knockout){
    return pb===rb ? PTS_WIN : 0; // fase de grupos: todo o nada
  }
  // fase de eliminación
  if(pb!==rb) return 0;           // ni siquiera acertó si fue empate (penales) o quién ganó en los 90+30
  if(pb!=='X') return PTS_WIN;    // acertó "gana 1" o "gana 2" directo -> 3 puntos
  // acertó que fue a penales (pb==='X' && rb==='X')
  const penOk = pickPen(pick) && pickPen(pick)===pickPen(result);
  return penOk ? PTS_WIN : 2;     // 2 por acertar el empate, +1 (total 3) si además acertó quién pasó
}

function standings(){
  const played = Object.keys(results).filter(k=>results[k]);
  const koIds = new Set([...K.map(m=>m.id), ...O.map(m=>m.id), ...Q.map(m=>m.id), ...S.map(m=>m.id)]);
  return users.map(u=>{
    let pts=0, ac=0;
    const picks = allPicks[u.id]||{};
    for(const mid of played){
      const p = calcPoints(picks[mid], results[mid], koIds.has(mid));
      pts += p;
      if(p>0) ac++;
    }
    return {...u, pts, ac, pj:played.length};
  }).sort((a,b)=> b.pts-a.pts || b.ac-a.ac || a.name.localeCompare(b.name));
}

  // Dieciseisavos de final — después
  html += `<div class="dayhead" style="margin-top:14px"><span class="dot" style="background:var(--green)"></span><span class="lbl">⚔ DIECISEISAVOS DE FINAL</span><span class="line"></span></div>`;

      lastDayK=dk;
    }

  }

  // Separador hacia fase de grupos
  html += `<div class="daygroup"></div><div class="dayhead" style="margin-top:26px"><span class="dot"></span><span class="lbl">FASE DE GRUPOS</span><span class="line"></span></div>`;

    <div class="num">${doneByMe}</div>

      <div class="t">Pronósticos cargados</div>

      <div class="bar"><i style="width:${pct}%"></i></div>

  </div>`;

  let lastDay=null;

      lastDay=dk;
    }
    html+=matchCard(m);
  }
  return html+`</div>`;
}

function matchCard(m){
  const st=matchState(m);
  const h=T[m.home], a=T[m.away];
  const mine=myPicks[m.id];
  const res=results[m.id];
  const mineBase = pickBase(mine), resBase = pickBase(res);

  const timeCls = st==="done"?"done":(st==="locked"?"locked":"");
  const timeTxt = st==="done"?"Finalizado":(st==="locked"?"🔒 "+timeLabel(m.ko):timeLabel(m.ko));

  function pickBtn(val,label){
    let cls="pick";
    if(st==="open"){ if(mineBase===val) cls+=" sel"; }
    else { cls+=" disabled";
      if(res){ if(val===resBase) cls+=" actual"; if(mineBase===val){ cls += (mineBase===resBase)?" res-correct":" res-wrong"; } }
      else if(mineBase===val){ cls+=" sel"; }
    }
    const onclick = st==="open" ? `onclick="pick('${m.id}','${val}')"` : "";
    return `<div class="${cls}" ${onclick}>${label}</div>`;
  }

  // Sub-selector "¿quién pasa por penales?" — solo en partidos de eliminación cuando el pick base es X
  let penSelector = "";
  if(m.knockout && mineBase==='X'){
    const minePen = pickPen(mine);
    if(st==="open"){
      const penBtn=(val,lbl)=>`<div class="pick" style="width:auto;padding:0 12px;font-size:14px;${minePen===val?'background:var(--amber);color:#1a1305;border-color:var(--amber)':''}" onclick="pickPenalty('${m.id}','${val}')">${lbl}</div>`;
      penSelector = `<div class="picks" style="margin-top:7px;justify-content:center;gap:8px">
        <span style="font-size:11px;color:var(--txt2);align-self:center;margin-right:2px">Penales, pasa:</span>
        ${penBtn('1',m.home)}${penBtn('2',m.away)}
      </div>`;
    } else if(resBase==='X'){
      const resPen = pickPen(res);
      const team = minePen==='1'?m.home:(minePen==='2'?m.away:null);
      const okPen = minePen && minePen===resPen;
      penSelector = `<div style="text-align:center;margin-top:6px;font-size:11.5px;color:${minePen?(okPen?'var(--green)':'var(--red)'):'var(--txt3)'}">
        ${minePen? 'Pasa por penales: '+team+(okPen?' ✅':' ❌') : 'No elegiste quién pasa por penales'}
      </div>`;
    }
  }

  let foot="";
  if(st==="open"){
    foot = `<div class="mfoot"><span class="status">${mine?'✓ Tu pronóstico: '+symLabel(mine,m):'Elegí un resultado'}</span></div>`;
  } else {
    const others = othersHTML(m);
    const revealed = openOthers[m.id];
    const pts = res ? calcPoints(mine, res, !!m.knockout) : null;
    const ptsTxt = res ? ' · '+(pts>0? '+'+pts+' pts':'0 pts') : '';
    foot = `<div class="mfoot">
      <span class="status">${mine?('Pusiste: '+symLabel(mine,m)+ptsTxt):'No pronosticaste'}</span>
      <button class="seebtn" onclick="toggleOthers('${m.id}')">${revealed?'Ocultar':'Ver pronósticos'} 👁</button>
    </div>
    <div class="others ${revealed?'show':''}">${others}</div>`;
  }

  return `<div class="match ${st!=='open'?'live':''}">
    <div class="top"><span class="gtag">${m.knockout?'⚔ ELIMINACIÓN':'GRUPO '+m.group}</span><span class="ktime ${timeCls}">${timeTxt}</span></div>
    <div class="row">
      <div class="team home"><span class="fl">${h.f}</span><span class="meta"><span class="ab">${m.home}</span><span class="nm">${esc(h.n)}</span></span></div>
      <div class="picks">${pickBtn('1','1')}${pickBtn('X','X')}${pickBtn('2','2')}</div>
      <div class="team away"><span class="meta"><span class="ab">${m.away}</span><span class="nm">${esc(a.n)}</span></span><span class="fl">${a.f}</span></div>
    </div>
    ${penSelector}
    ${foot}
  </div>`;
}

function symLabel(v,m){
  const base=pickBase(v);
  if(base==="1")return "Gana "+m.home;
  if(base==="2")return "Gana "+m.away;
  if(base==="X"){
    const pen=pickPen(v);
    if(pen) return "Empate (pasa "+(pen==='1'?m.home:m.away)+")";
    return "Empate";
  }
  return "Empate";
}

function othersHTML(m){
  const res=results[m.id];
  let rows = users.map(u=>{
    const p=(allPicks[u.id]||{})[m.id];
    let badge='<span class="obadge">–</span>';
    if(p){
      const pb=pickBase(p);
      let cls="obadge";
      let label=pb;
      if(res){
        const pts=calcPoints(p,res,!!m.knockout);
        cls += pts>0 ? " ok" : " no";
        if(pb==='X' && pickPen(p)) label = pb+(pickPen(p)==='1'?'·1':'·2');
      }
      badge=`<span class="${cls}">${label}</span>`;
    }
    return `<div class="orow"><span class="onm">${esc(u.name)}</span>${badge}</div>`;
  }).join("");
  if(!users.length) rows=`<div class="orow"><span class="onm" style="color:var(--txt3)">Sin jugadores todavía</span></div>`;
  return rows;
}

function scoreText(res){ if(res==="1")return "1 ◂"; if(res==="2")return "▸ 2"; return "X"; }
function scoreTextKO(res,m){
  const b=pickBase(res);
  if(b==="1")return "1 ◂";
  if(b==="2")return "▸ 2";
  if(b==="X"){ const p=pickPen(res); return p==='1'?"P:1◂":(p==='2'?"▸P:2":"X (pen)"); }
  return "—";
}

  inp.value='';

  // Traer jugadores actuales y ver si ya existe alguien con ese nombre (sin importar mayúsculas/espacios)
  const all = await supabaseCall('GET','players','?select=id,name') || [];
  const found = all.find(p => normName(p.name) === normName(v));
  if(found){
    // Recuperar identidad existente en vez de crear un duplicado
    me = { id: found.id, name: found.name };
    localStorage.setItem("me", JSON.stringify(me));
    await loadShared();
    myPicks = allPicks[me.id] || {};
    toast("¡Hola de nuevo, "+me.name+"! 👋");
    render();
    return;
  }
  // Nombre nuevo: crear jugador
  me={ id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), name:v };
  const res = await supabaseCall('POST', 'players', '', {id:me.id, name:me.name});
  if(res === null){ toast("Error al crear jugador, intentá de nuevo"); return; }
  localStorage.setItem("me", JSON.stringify(me));
  myPicks={};
  await loadShared();
  toast("¡Bienvenido, "+v+"! ⚽");
  render();
}

async function logout(){
  if(!confirm("¿Cambiar de jugador en este dispositivo? Tus pronósticos quedan guardados en el prode.")) return;
  me=null; myPicks={}; isAdmin=false;
  try{ localStorage.removeItem("me"); }catch(e){}
  render();
}

function findMatch(mid){ return M.find(x=>x.id===mid) || K.find(x=>x.id===mid) || O.find(x=>x.id===mid) || Q.find(x=>x.id===mid) || S.find(x=>x.id===mid); }

async function savePick(mid, val){
  myPicks[mid] = val;
  // Upsert atómico: evita la carrera de "GET para decidir POST o PATCH", que podía
  // crear filas duplicadas si el GET fallaba por una conexión lenta o un doble click.
  // Requiere una unique constraint en (player_id, match_id) en la tabla `picks`.
  const ok = await supabaseCall(
    'POST',
    'picks',
    '?on_conflict=player_id,match_id',
    {player_id:me.id, match_id:mid, pick:val},
    {'Prefer':'resolution=merge-duplicates,return=representation'}
  );
  await loadShared();
  return ok;
}

async function pick(mid,val){
  const m=findMatch(mid);
  if(!m || matchState(m)!=="open"){ toast("Ese partido ya empezó 🔒"); render(); return; }
  // Si cambia la elección base, se pierde el sub-pick de penales anterior (no aplica si vuelve a elegir lo mismo)
  const newVal = val;
  const ok = await savePick(mid, newVal);
  if(!ok) toast("No se pudo guardar, probá de nuevo");
  render();
}

async function pickPenalty(mid,val){
  const m=findMatch(mid);
  if(!m || matchState(m)!=="open"){ toast("Ese partido ya empezó 🔒"); render(); return; }
  const ok = await savePick(mid, 'X:'+val);
  if(!ok) toast("No se pudo guardar, probá de nuevo");
  render();
}

function checkPin(){
  const v=document.getElementById("pinInput").value.trim();
  if(v===ADMIN_PIN){ isAdmin=true; toast("Modo admin activado"); render(); }
  else toast("Clave incorrecta");
}

async function setResult(mid,val){
  if(val){
    await supabaseCall(
      'POST', 'results', '?on_conflict=match_id',
      {match_id:mid, result:val},
      {'Prefer':'resolution=merge-duplicates,return=representation'}
    );
  } else {
    await supabaseCall('DELETE', 'results', `?match_id=eq.${mid}`);
  }
  await loadShared();
  toast(val?"Resultado guardado ✓":"Resultado borrado");
  render();
}

async function setResultPenalty(mid, val){
  const newVal = 'X:'+val;
  await supabaseCall(
    'POST', 'results', '?on_conflict=match_id',
    {match_id:mid, result:newVal},
    {'Prefer':'resolution=merge-duplicates,return=representation'}
  );
  await loadShared();
  toast("Pase por penales guardado ✓");
  render();
}

async function refresh(btn){
  const ic=document.getElementById("rfi"); if(ic) ic.className="spin";
  await loadShared();
  if(me && allPicks[me.id]) myPicks=allPicks[me.id];
  toast("Actualizado");
  render();
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  try{
    const meRaw = localStorage.getItem("me");
    if(meRaw){ try{ me=JSON.parse(meRaw); }catch(e){ me=null; } }
    await loadShared();
    // Si el usuario guardado ya no existe (p. ej. tras unificar duplicados), pedir el nombre de nuevo
    if(me && !users.some(u=>u.id===me.id)){ me=null; try{ localStorage.removeItem("me"); }catch(e){} }
    if(me && allPicks[me.id]) myPicks=allPicks[me.id];
    render();
  }catch(e){
    console.error('Init error:', e);
    app.innerHTML=`<div class="wrap"><div class="empty"><span class="e">⚠️</span>No se pudo iniciar el prode.<br>Recargá la página.</div></div>`;
  }
})();
</script>
